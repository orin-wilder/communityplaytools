*{box-sizing:border-box;margin:0;padding:0}body,html,#root{font-family:'DM Sans',sans-serif;background:#f5f0e8;color:#1a1a2e;min-height:100vh}
.serif{font-family:'DM Serif Display',serif}.app{max-width:520px;margin:0 auto;padding:16px;min-height:100vh}
.card{background:#fff;border:1px solid #e0dbd0;border-radius:12px;padding:20px;margin-bottom:12px}
.card-flat{background:#f5f0e8;border:1px solid #e0dbd0;border-radius:10px;padding:16px;margin-bottom:8px}
.card-click{cursor:pointer;transition:box-shadow .15s}.card-click:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
h1.serif{font-size:28px;line-height:1.2;margin-bottom:4px}h2.serif{font-size:22px;line-height:1.2;margin-bottom:4px}h3.serif{font-size:18px;line-height:1.2;margin-bottom:4px}
.subtitle{color:#8a8578;font-size:14px;margin-bottom:16px}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#8a8578;margin-bottom:6px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #e0dbd0;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:15px;background:#fff;color:#1a1a2e;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:#e8632b}textarea{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.97)}.btn-primary{background:#e8632b;color:#fff}.btn-primary:hover{background:#d05520}
.btn-secondary{background:#1a1a2e;color:#fff}.btn-secondary:hover{background:#2a2a4e}
.btn-ghost{background:transparent;color:#e8632b;border:1px solid #e0dbd0}.btn-ghost:hover{background:#fff0e8}
.btn-sm{padding:6px 12px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}.btn-block{width:100%}
.badge-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#fff0e8;color:#e8632b}
.tier-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tier-1{background:#fdf0e0;color:#8b6914}.tier-2{background:#f0f0f0;color:#606060}.tier-3{background:#fff8e0;color:#9a7b00}.tier-4{background:#e8f0ff;color:#3a6fba}.tier-5{background:#f0e8ff;color:#7b3fba}
.progress-bar{width:100%;height:8px;background:#e0dbd0;border-radius:99px;overflow:hidden;margin:6px 0}.progress-fill{height:100%;border-radius:99px;transition:width .5s ease}
.nav{display:flex;gap:2px;margin-bottom:16px;background:#fff;border:1px solid #e0dbd0;border-radius:10px;padding:3px}
.nav-item{flex:1;padding:8px 4px;text-align:center;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:#8a8578;border:none;background:transparent}.nav-item.active{background:#1a1a2e;color:#fff}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-box{text-align:center;padding:12px 8px;background:#fff;border:1px solid #e0dbd0;border-radius:10px}
.stat-num{font-size:24px;font-weight:700;color:#e8632b}.stat-label{font-size:11px;color:#8a8578;margin-top:2px}
.checkin-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e0dbd0;font-size:14px}.checkin-row:last-child{border-bottom:none}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid transparent;border-radius:8px;cursor:pointer;background:#f5f0e8;transition:all .1s}.emoji-btn:hover{background:#fff0e8}.emoji-btn.selected{border-color:#e8632b;background:#fff0e8}
.field{margin-bottom:14px}.merit-slider{width:100%;accent-color:#e8632b;margin:4px 0}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e0dbd0}
.link{color:#e8632b;cursor:pointer;font-weight:600;font-size:14px}.link:hover{text-decoration:underline}
.qr-container{text-align:center;padding:16px;background:#fff;border-radius:12px}
.empty-state{text-align:center;padding:40px 16px;color:#8a8578}
.live-count{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;background:#e8f5e9;color:#2d8a4e}
.live-dot{width:7px;height:7px;border-radius:50%;background:#2d8a4e;animation:pulse 2s infinite}
.event-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.step-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:10px;margin-bottom:6px;border:1px solid #e0dbd0;transition:all .2s}
.step-item.completed{background:#e8f5e9;border-color:#c8e6c9}.step-item.available{background:#fff;cursor:pointer}.step-item.available:hover{border-color:#e8632b}.step-item.locked{background:#f5f3ef;opacity:.6}
.step-circle{width:28px;height:28px;min-width:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.step-circle.done{background:#2d8a4e;color:#fff}.step-circle.open{background:#fff;border:2px solid #e8632b;color:#e8632b}.step-circle.num{background:#e0dbd0;color:#8a8578}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.status-live{background:#e8f5e9;color:#2d8a4e}.status-soon{background:#fff8e0;color:#9a7b00}.status-ended{background:#f0f0f0;color:#8a8578}.status-evergreen{background:#e8f0ff;color:#3a6fba}
.countdown{font-size:12px;color:#8a8578;font-weight:500}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.toggle{width:44px;height:24px;border-radius:12px;background:#e0dbd0;position:relative;cursor:pointer;transition:background .2s}.toggle.on{background:#e8632b}
.toggle-knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}.toggle.on .toggle-knob{left:22px}
.bonus-banner{background:linear-gradient(135deg,#fff8e0,#fff0e8);border:1px solid #ffd700;border-radius:10px;padding:12px 16px;text-align:center;margin-bottom:12px}
.avatar{border-radius:50%;object-fit:cover;background:#e0dbd0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.avatar-sm{width:36px;height:36px;font-size:14px}.avatar-md{width:48px;height:48px;font-size:18px}.avatar-lg{width:80px;height:80px;font-size:28px}
.quick-code{font-family:'DM Serif Display',serif;font-size:28px;letter-spacing:8px;color:#e8632b;text-align:center;padding:12px;background:#fff0e8;border-radius:10px}
.section-label{font-size:13px;font-weight:600;color:#8a8578;margin-bottom:10px;margin-top:16px}
.tier-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #e0dbd0}.tier-row:last-child{border-bottom:none}
.checkin-success{text-align:center;padding:32px 16px;animation:fadeUp .4s ease}.checkin-success .emoji{font-size:64px;margin-bottom:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fade-in{animation:fadeUp .3s ease}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const SB_URL = "https://cphnmkuwrwkpfpelzvbn.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwaG5ta3V3cndrcGZwZWx6dmJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODA2MDAsImV4cCI6MjA4MDI1NjYwMH0.w2R55BcMbaL1PLyBWsy1GPnHeDx0RI8m3fRtc0t1nQ0";
const DEMO_S = "demo-steward@communitymerit.app";
const DEMO_U = "demo-user@communitymerit.app";
const sb={from:(t)=>{let u=`${SB_URL}/rest/v1/${t}`,h={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,"Content-Type":"application/json",Prefer:"return=representation"},p=[],m="GET",bd=null;
const b={select:(c="*")=>{p.push(`select=${encodeURIComponent(c)}`);return b},eq:(c,v)=>{p.push(`${c}=eq.${v}`);return b},neq:(c,v)=>{p.push(`${c}=neq.${v}`);return b},
gte:(c,v)=>{p.push(`${c}=gte.${encodeURIComponent(v)}`);return b},lte:(c,v)=>{p.push(`${c}=lte.${encodeURIComponent(v)}`);return b},
is:(c,v)=>{p.push(`${c}=is.${v}`);return b},or:(x)=>{p.push(`or=(${x})`);return b},
order:(c,o={})=>{p.push(`order=${c}.${o.ascending?'asc':'desc'}`);return b},limit:(n)=>{p.push(`limit=${n}`);return b},
single:()=>{h["Accept"]="application/vnd.pgrst.object+json";return b},insert:(d)=>{m="POST";bd=JSON.stringify(d);return b},update:(d)=>{m="PATCH";bd=JSON.stringify(d);return b},
upsert:(d)=>{m="POST";bd=JSON.stringify(d);h["Prefer"]="resolution=merge-duplicates,return=representation";return b},delete:()=>{m="DELETE";return b},
then:async(resolve)=>{const sep=u.includes("?")?"&":"?";const full=p.length?`${u}${sep}${p.join("&")}`:u;
try{const r=await fetch(full,{method:m,headers:h,body:bd});const txt=await r.text();const d=txt?JSON.parse(txt):null;resolve(r.ok?{data:d,error:null}:{data:null,error:d});}catch(e){resolve({data:null,error:e});}},};return b;}};
const EMOJIS=["🌿","🌊","🚲","🎨","🌻","🏃","📚","🎵","🐕","🧹","🌳","☀️","🤝","🏠","🍳","⭐","🔥","💧","🌈","🎭","🏆","💚","🗳️","🛠️"];
const TIER_COLORS=["","#cd7f32","#a8a8a8","#ffd700","#3a6fba","#7b3fba"];
const qrUrl=(t,s=200)=>`https://api.qrserver.com/v1/create-qr-code/?size=${s}x${s}&data=${encodeURIComponent(t)}&bgcolor=f5f0e8&color=1a1a2e&margin=8`;
const getRoute=()=>{const h=window.location.hash.slice(1)||"/";return{path:h,parts:h.split("/").filter(Boolean)}};
const nav=(p)=>{window.location.hash=p};
function evStatus(ev){const n=new Date(),s=ev.starts_at?new Date(ev.starts_at):null,e=ev.ends_at?new Date(ev.ends_at):null;if(e&&n>e)return"ended";if(s&&n>=s&&(!e||n<=e))return"live";if(s&&n<s)return"upcoming";return"evergreen";}
function timeUntil(d){const df=new Date(d)-new Date();if(df<=0)return"now";const dy=Math.floor(df/864e5),hr=Math.floor(df%864e5/36e5),mn=Math.floor(df%36e5/6e4);return dy>0?`${dy}d ${hr}h`:hr>0?`${hr}h ${mn}m`:`${mn}m`;}
function timeLeft(d){const df=new Date(d)-new Date();if(df<=0)return"ended";const dy=Math.floor(df/864e5),hr=Math.floor(df%864e5/36e5);return dy>0?`${dy} day${dy!==1?'s':''} left`:`${hr} hour${hr!==1?'s':''} left`;}
const fd=(d)=>new Date(d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const fl=(d)=>new Date(d).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const ft=(d)=>new Date(d).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
function getTierInfo(badge,merit){
  const tc=badge.tier_count||3;const tiers=[];
  for(let i=1;i<=tc;i++)tiers.push({name:badge[`tier${i}_name`],min:badge[`tier${i}_min`]});
  let ct=0;for(let i=tiers.length-1;i>=0;i--)if(merit>=tiers[i].min){ct=i+1;break;}
  const nt=ct<tc?ct:tc-1;const pm=ct>=tc?tiers[tc-1].min:tiers[nt].min;
  return{tiers,currentTier:ct,tierCount:tc,nextMin:pm,currentName:ct>0?tiers[ct-1].name:"",nextName:ct<tc?tiers[nt].name:""};
}
const initColor=(name)=>{let h=0;for(let i=0;i<(name||"").length;i++)h=name.charCodeAt(i)+((h<<5)-h);return `hsl(${Math.abs(h)%360},45%,55%)`;}
function Avatar({url,name,size}){const cls=size==="lg"?"avatar-lg":size==="md"?"avatar-md":"avatar-sm";const init=(name||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return url?<img src={url} className={`avatar ${cls}`} alt={name}/>:<div className={`avatar ${cls}`} style={{background:initColor(name)}}>{init}</div>;}
function TopBar({title,back,right}){return(<div className="top-bar"><div style={{display:"flex",alignItems:"center",gap:8}}>{back&&<span className="link" onClick={()=>nav(back)}>←</span>}<span style={{fontWeight:600,fontSize:16}}>{title}</span></div>{right}</div>)}
function PBar({cur,max,color}){return(<div className="progress-bar"><div className="progress-fill" style={{width:`${Math.min(cur/max*100,100)}%`,background:color||"#e8632b"}}/></div>)}
function TBadge({tier,name}){return <span className={`tier-badge tier-${Math.min(tier,5)}`}>{name||`Tier ${tier}`}</span>}
function LCount({count}){return(<div className="live-count"><div className="live-dot"/>{count} checked in</div>)}
function SPill({status,ev}){if(status==="live")return <span className="status-pill status-live">● Live</span>;if(status==="upcoming")return <span className="status-pill status-soon">⏳ {timeUntil(ev.starts_at)}</span>;if(status==="ended")return <span className="status-pill status-ended">Ended</span>;return <span className="status-pill status-evergreen">Ongoing</span>;}
function Toggle({on,onToggle,label}){return(<div className="toggle-row"><span style={{fontSize:14,fontWeight:500}}>{label}</span><div className={`toggle ${on?"on":""}`} onClick={onToggle}><div className="toggle-knob"/></div></div>)}
// find or create user (replaces upsert)
async function findOrCreateUser(email,name){const{data:ex}=await sb.from("users").select("*").eq("email",email).single();if(ex)return ex;if(!name)return null;const{data:nu}=await sb.from("users").insert({email,name});return nu&&nu[0]?nu[0]:null;}
function HomePage(){
  const[ld,sLd]=useState("");const u=JSON.parse(localStorage.getItem("user")||"null");
  const go=async(t)=>{sLd(t);const e=t==="steward"?DEMO_S:DEMO_U,tb=t==="steward"?"stewards":"users",k=t==="steward"?"steward":"user";
    const{data:d}=await sb.from(tb).select("*").eq("email",e).single();if(d){localStorage.setItem(k,JSON.stringify(d));nav(t==="steward"?"/steward/dashboard":"/profile");}else alert("Demo data not found.");sLd("");};
  return(<div className="fade-in" style={{paddingTop:40,textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>🏘️</div><h1 className="serif" style={{fontSize:32,marginBottom:8}}>Community Merit</h1><p className="subtitle" style={{maxWidth:300,margin:"0 auto 32px"}}>Earn recognition for what you do for your community.</p>
    <div style={{display:"flex",flexDirection:"column",gap:10,maxWidth:280,margin:"0 auto"}}>

    <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}><button className="btn btn-secondary btn-sm" onClick={()=>go("steward")} disabled={!!ld}>{ld==="steward"?"...":"👑 Demo Steward"}</button><button className="btn btn-secondary btn-sm" onClick={()=>go("user")} disabled={!!ld}>{ld==="user"?"...":"🏅 Demo User"}</button></div>

  const[email,sE]=useState(""),[mode,sM]=useState("login"),[ld,sLd]=useState(false),[err,sErr]=useState("");

function ExplorePage(){

  useEffect(()=>{sb.from("explore_events").select("*").then(({data:d})=>{sEvs(d||[]);sLd(false);});},[]);

  const ended=evs.filter(e=>evStatus(e)==="ended").sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at)).slice(0,5);
  const EvCard=({ev})=>{const s=evStatus(ev);return(

          <p style={{fontSize:12,color:"#8a8578"}}>{ev.steward_name}{ev.steward_org&&` · ${ev.steward_org}`}</p></div><SPill status={s} ev={ev}/></div></div></div>

        {s!=="upcoming"&&<LCount count={ev.checkin_count||0}/>}</div>
      {ev.location&&<p style={{fontSize:12,color:"#8a8578",marginTop:6}}>📍 {ev.location}</p>}
      {s==="live"&&ev.ends_at&&<p className="countdown" style={{marginTop:4}}>{timeLeft(ev.ends_at)}</p>}
      {s==="upcoming"&&<p className="countdown" style={{marginTop:4}}>Opens in {timeUntil(ev.starts_at)}</p>}

    {mp.length>0&&<div className="card"><h3 className="serif" style={{marginBottom:12}}>Multi-Step Progress</h3>
      {mp.map(m=>(<div key={m.event_id} className="card-flat card-click" onClick={()=>nav(`/event/${m.event_id}`)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontWeight:600,fontSize:14}}>{m.event_title}</span>{m.steps_completed>=m.total_steps&&<span style={{fontSize:12,color:"#2d8a4e",fontWeight:600}}>✓ Complete</span>}</div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#8a8578",marginBottom:4}}><span>{m.steps_completed} of {m.total_steps} steps</span><span>{m.merit_earned} merit</span></div>
        <PBar cur={m.steps_completed} max={m.total_steps} color={m.steps_completed>=m.total_steps?"#2d8a4e":"#e8632b"}/></div>))}</div>}

    <div className="card"><h3 className="serif" style={{marginBottom:12}}>Check-in History</h3>
      {cis.length===0?<p style={{fontSize:13,color:"#8a8578"}}>No check-ins yet.</p>:cis.map(c=>{
        return(<div key={c.id} className="checkin-row"><div><span style={{fontWeight:600}}>{c.evTitle}</span><p style={{fontSize:12,color:"#8a8578"}}>{new Date(c.checked_in_at).toLocaleDateString()}{c.evLoc&&` · ${c.evLoc}`}</p></div>
        <span className="badge-pill" style={{fontSize:12}}>{c.bdEmoji} +{c.merit_earned}</span></div>);})}</div>
  </div>);}

function BadgeDetail({badgeId}){
  const[user,sU]=useState(null),[badge,sBd]=useState(null),[myCis,sMC]=useState([]),[upcoming,sUp]=useState([]);
  useEffect(()=>{const u=JSON.parse(localStorage.getItem("user")||"null");if(!u){nav("/profile/login");return;}sU(u);ld(u.id);},[badgeId]);
  const ld=async(uid)=>{
    const{data:bp}=await sb.from("user_badge_progress").select("*").eq("user_id",uid).eq("badge_id",badgeId).single();
    if(bp){// get full badge info
      const{data:b}=await sb.from("badges").select("*").eq("id",badgeId).single();sBd({...bp,...b});}
    // My check-ins for this badge
    const{data:ci}=await sb.from("checkins").select("*").eq("user_id",uid);
    const myBadgeCis=[];for(const c of(ci||[])){const{data:ev}=await sb.from("events").select("title,location,starts_at,badge_id").eq("id",c.event_id).single();if(ev?.badge_id===badgeId)myBadgeCis.push({...c,evTitle:ev.title,evLoc:ev.location,evStart:ev.starts_at});}
    sMC(myBadgeCis.sort((a,b)=>new Date(b.checked_in_at)-new Date(a.checked_in_at)));
    // Upcoming events with this badge
    const{data:ev}=await sb.from("events").select("*").eq("badge_id",badgeId);
    sUp((ev||[]).filter(e=>{const s=evStatus(e);return s==="live"||s==="upcoming"||s==="evergreen";}).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)));
  };
  if(!badge)return<div className="app fade-in"><p>Loading...</p></div>;
  const ti=getTierInfo(badge,badge.total_merit);
  return(<div className="fade-in"><TopBar title={`${badge.badge_emoji} ${badge.badge_name}`} back="/profile"/>
    <div className="card" style={{textAlign:"center"}}><span style={{fontSize:48}}>{badge.badge_emoji}</span><h2 className="serif" style={{marginTop:8}}>{badge.badge_name}</h2>
      {badge.badge_description&&<p style={{fontSize:14,color:"#8a8578",marginTop:4}}>{badge.badge_description}</p>}
      <div style={{marginTop:12}}><span style={{fontSize:28,fontWeight:700,color:"#e8632b"}}>{badge.total_merit}</span><span style={{fontSize:13,color:"#8a8578",marginLeft:4}}>merit</span></div>
      {ti.currentTier>0&&<div style={{marginTop:8}}><TBadge tier={ti.currentTier} name={ti.currentName}/></div>}
      <div style={{maxWidth:300,margin:"12px auto 0"}}><PBar cur={badge.total_merit} max={ti.nextMin} color={TIER_COLORS[ti.currentTier]||"#e8632b"}/>{ti.currentTier<ti.tierCount&&<p style={{fontSize:12,color:"#8a8578"}}>{ti.nextMin-badge.total_merit} more to {ti.nextName}</p>}</div>
      <div style={{display:"flex",gap:6,justifyContent:"center",flexWrap:"wrap",marginTop:12}}>{ti.tiers.map((t,i)=>(<TBadge key={i} tier={i+1} name={`${t.name} (${t.min}+)`}/>))}</div>
    </div>

    {myCis.length>0&&<div className="card"><h3 className="serif" style={{marginBottom:10}}>My Events ({myCis.length})</h3>
      {myCis.map(c=>(<div key={c.id} className="checkin-row"><div><span style={{fontWeight:600}}>{c.evTitle||"Event"}</span><p style={{fontSize:12,color:"#8a8578"}}>{fd(c.checked_in_at)}{c.evLoc&&` · ${c.evLoc}`}</p></div><span className="badge-pill" style={{fontSize:12}}>+{c.merit_earned}</span></div>))}</div>}

    {upcoming.length>0&&<div className="card"><h3 className="serif" style={{marginBottom:10}}>Upcoming Opportunities</h3>
      {upcoming.map(e=>(<div key={e.id} className="card-flat card-click" onClick={()=>nav(`/event/${e.id}`)}><div style={{display:"flex",justifyContent:"space-between"}}><div><span style={{fontWeight:600}}>{e.title}</span><p style={{fontSize:12,color:"#8a8578"}}>{fd(e.starts_at)}{e.location&&` · ${e.location}`}</p></div><SPill status={evStatus(e)} ev={e}/></div></div>))}</div>}

    {upcoming.length===0&&myCis.length>0&&<div className="card"><p style={{fontSize:13,color:"#8a8578",textAlign:"center"}}>No upcoming events for this badge right now.</p></div>}
  </div>);}

function App(){const[r,sR]=useState(getRoute());useEffect(()=>{const h=()=>sR(getRoute());window.addEventListener("hashchange",h);return()=>window.removeEventListener("hashchange",h);},[]);const{parts:p}=r;let pg;
  if(!p.length||(p.length===1&&p[0]===""))pg=<HomePage/>;
  else if(p[0]==="explore")pg=<ExplorePage/>;
  else if(p[0]==="steward"&&p[1]==="login")pg=<StewardLogin/>;
  else if(p[0]==="steward"&&p[1]==="dashboard")pg=<StewardDashboard/>;
  else if(p[0]==="steward"&&p[1]==="event"&&p[2]==="new")pg=<CreateEvent/>;
  else if(p[0]==="steward"&&p[1]==="event"&&p[2])pg=<StewardEventDetail eventId={p[2]}/>;
  else if(p[0]==="steward"&&p[1]==="badge"&&p[2]==="new")pg=<CreateBadge/>;
  else if(p[0]==="steward"&&p[1]&&p.length===2)pg=<StewardPublicProfile stewardId={p[1]}/>;
  else if(p[0]==="event"&&p[1]&&p[2]==="step"&&p[3])pg=<EventCheckin eventId={p[1]} stepId={p[3]}/>;
  else if(p[0]==="event"&&p[1])pg=<EventCheckin eventId={p[1]}/>;
  else if(p[0]==="profile"&&p[1]==="login")pg=<ProfileLogin/>;
  else if(p[0]==="profile"&&p[1]==="badge"&&p[2])pg=<BadgeDetail badgeId={p[2]}/>;
  else if(p[0]==="profile")pg=<UserProfile/>;
  else pg=<HomePage/>;
  return <div className="app">{pg}</div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
