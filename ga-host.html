<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gather Again Host Prototype | Community Play Tools</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Prototype host dashboard for recurring gatherings.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0" integrity="sha384-DjOvX/sJLsmbMrw4wTvf6l3kiGBjdxyOO6X2MTFwOOXGkjN/mE08BoDzrpaaIjil" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js" integrity="sha384-ezQ6HS3FLspd9te19o2McUV6FAK091+GG7KO54f/R8DKgCDi7fULhapNrd5LY+vG" crossorigin="anonymous"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-stone-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { createClient } = supabase;

    const SUPABASE_URL      = 'https://cphnmkuwrwkpfpelzvbn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwaG5ta3V3cndrcGZwZWx6dmJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODA2MDAsImV4cCI6MjA4MDI1NjYwMH0.w2R55BcMbaL1PLyBWsy1GPnHeDx0RI8m3fRtc0t1nQ0';
    const ATTEND_BASE       = window.location.origin + '/ga-attend.html';
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const QUESTION_SUGGESTIONS = {
      networking: ["What's your superpower?","What are you working on right now?","Best recent win?","What brings you tonight?"],
      nonprofit: ["How long have you been a member?","What committee are you on?","What's your priority this year?","What would make tonight a success for you?"],
      fitness: ["Any injuries we should know about?","What's your experience level?","What position do you play?","Goals for this session?"],
      general: ["How did you hear about us?","What do you hope to get out of today?","Anything you want others to know?"],
    };

    const slugify = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,5);
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : 'Date TBD';
    const fmtPhone = (p) => { const d=(p||'').replace(/\D/g,''); return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:p||'—'; };
    const fmtDateShort = (d) => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
    const statusColor = (used,limit) => { if(limit==null) return 'green'; const r=limit-used; return r<=0?'red':r<=2?'yellow':'green'; };

    const exportCSV = (attendees, event) => {
      const questions = event.custom_questions || [];
      const headers = ['Name','Phone','Checked In','Checked In At','Merit Received','Preview Opt-in','Package',...questions.map(q=>q.question)];
      const rows = attendees.map(a => [a.members?.name||'',a.members?.phone||'',a.checked_in?'Yes':'No',a.checked_in_at?new Date(a.checked_in_at).toLocaleString():'',a.merit_received||0,a.opt_in_preview?'Yes':'No',a.member_package_id?'Package':'Drop-in',...questions.map(q=>(a.answers?.[q.id]||'').replace(/"/g,'""'))]);
      const csv = [headers.map(h=>`"${String(h).replace(/"/g,'""')}"`).join(','),...rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','))].join('\n');
      const blob = new Blob([csv],{type:'text/csv'}); const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=`${event.slug}-attendees.csv`; a.click(); URL.revokeObjectURL(url);
    };

    const STATUS_COLORS = {upcoming:'stone',active:'green',lobby:'purple',closed:'stone'};
    const STATUS_LABELS = {upcoming:'Upcoming',active:'Live',lobby:'Lobby Open',closed:'Closed'};

    // ── Primitives ──────────────────────────────────────────────
    const Btn = ({children,onClick,variant='primary',size='md',disabled,className=''}) => {
      const base='font-medium rounded-lg transition-colors focus:outline-none cursor-pointer select-none';
      const sz={sm:'px-3 py-1.5 text-xs',md:'px-4 py-2 text-sm',lg:'px-6 py-3 text-base'};
      const vr={primary:'bg-amber-500 hover:bg-amber-600 text-white disabled:opacity-50',secondary:'bg-stone-100 hover:bg-stone-200 text-stone-700',success:'bg-green-500 hover:bg-green-600 text-white',danger:'bg-red-500 hover:bg-red-600 text-white',ghost:'text-stone-500 hover:text-stone-800 hover:bg-stone-100','ghost-danger':'text-stone-400 hover:text-red-600 hover:bg-red-50'};
      return <button onClick={onClick} disabled={disabled} className={`${base} ${sz[size]} ${vr[variant]||vr.primary} ${className}`}>{children}</button>;
    };
    const Badge = ({children,color='stone'}) => {
      const c={stone:'bg-stone-100 text-stone-600',green:'bg-green-100 text-green-700',amber:'bg-amber-100 text-amber-700',purple:'bg-purple-100 text-purple-700',blue:'bg-blue-100 text-blue-700',red:'bg-red-100 text-red-700',yellow:'bg-yellow-100 text-yellow-700'};
      return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${c[color]||c.stone}`}>{children}</span>;
    };
    const Field = ({label,children,helper}) => <div>{label&&<label className="block text-sm font-medium text-stone-700 mb-1">{label}</label>}{children}{helper&&<p className="text-xs text-stone-400 mt-1">{helper}</p>}</div>;
    const TextInput = ({value,onChange,placeholder,type='text',className=''}) => <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className={`w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white ${className}`}/>;
    const Toggle = ({label,checked,onChange,helper}) => <div className="flex items-start gap-3"><button role="switch" aria-checked={checked} onClick={()=>onChange(!checked)} className={`relative mt-0.5 inline-flex h-5 w-9 flex-shrink-0 rounded-full transition-colors ${checked?'bg-amber-500':'bg-stone-300'}`}><span className={`inline-block h-4 w-4 mt-0.5 rounded-full bg-white shadow transform transition-transform ${checked?'translate-x-4 ml-0.5':'translate-x-0.5'}`}/></button><div><div className="text-sm font-medium text-stone-700">{label}</div>{helper&&<div className="text-xs text-stone-500">{helper}</div>}</div></div>;
    const Card = ({children,className='',onClick,...rest}) => <div onClick={onClick} {...rest} className={`bg-white rounded-xl border border-stone-200 ${className}${onClick?' cursor-pointer':''}`}>{children}</div>;
    const BackBtn = ({onClick}) => <button onClick={onClick} className="text-stone-400 hover:text-stone-700 transition p-1 -ml-1"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7"/></svg></button>;
    const Toast = ({message,onClose}) => { useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t);},[]); return <div className="fixed top-4 right-4 z-50 bg-stone-900 text-white px-4 py-2.5 rounded-xl text-sm shadow-lg fade-in">{message}</div>; };

    // ── Auth ─────────────────────────────────────────────────────
    function AuthPage() {
      const [loading,setLoading]=useState(null); const [err,setErr]=useState(null);
      const login = async(provider)=>{ setLoading(provider);setErr(null); const{error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:window.location.href}}); if(error){setErr(error.message);setLoading(null);} };
      return <div className="min-h-screen bg-stone-50 flex items-center justify-center p-4"><div className="bg-white rounded-2xl shadow-sm border border-stone-200 p-8 w-full max-w-sm"><div className="text-center mb-8"><div className="text-4xl mb-2">🌀</div><h1 className="text-2xl font-bold text-stone-900">Gather Again</h1><p className="text-stone-500 text-sm mt-1">Host Dashboard</p></div><div className="space-y-3"><button onClick={()=>login('google')} disabled={!!loading} className="w-full flex items-center gap-3 px-4 py-3 border border-stone-200 rounded-xl hover:bg-stone-50 transition text-sm font-medium disabled:opacity-60"><svg className="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66 2.84-.62-.47.62-.24z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>{loading==='google'?'Connecting…':'Continue with Google'}</button><button onClick={()=>login('discord')} disabled={!!loading} className="w-full flex items-center gap-3 px-4 py-3 border border-stone-200 rounded-xl hover:bg-stone-50 transition text-sm font-medium disabled:opacity-60"><svg className="w-5 h-5 flex-shrink-0" fill="#5865F2" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057c.001.022.012.043.03.057a19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>{loading==='discord'?'Connecting…':'Continue with Discord'}</button></div>{err&&<p className="text-red-500 text-xs text-center mt-4">{err}</p>}<p className="text-xs text-stone-400 text-center mt-6">Hosts only. Attendees use the event link or QR code.</p></div></div>;
    }

    // ── Questions Card (shared between series + event forms) ─────
    function QuestionsCard({questions,setQuestions,qType,setQType}) {
      const addQ=()=>{if(questions.length>=3)return;setQuestions([...questions,{id:Date.now().toString(),question:''}]);};
      const removeQ=(id)=>setQuestions(questions.filter(q=>q.id!==id));
      const updateQ=(id,val)=>setQuestions(questions.map(q=>q.id===id?{...q,question:val}:q));
      const applySuggestion=(s)=>{if(questions.length>=3||questions.some(q=>q.question===s))return;setQuestions([...questions,{id:Date.now().toString(),question:s}]);};
      const suggestions=QUESTION_SUGGESTIONS[qType]||[];
      return <Card className="p-5 space-y-4"><div className="flex items-start justify-between gap-2"><div><h2 className="font-semibold text-stone-900">Check-in Questions</h2><p className="text-xs text-stone-500 mt-0.5">All optional for attendees. Up to 3.</p></div>{questions.length<3&&<Btn variant="secondary" size="sm" onClick={addQ}>+ Add</Btn>}</div>{questions.map((q,i)=><div key={q.id} className="flex gap-2 items-center"><TextInput value={q.question} onChange={v=>updateQ(q.id,v)} placeholder={`Question ${i+1}`} className="flex-1"/><button onClick={()=>removeQ(q.id)} className="text-stone-400 hover:text-red-500 flex-shrink-0"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/></svg></button></div>)}<div><div className="flex gap-1.5 mb-2">{Object.keys(QUESTION_SUGGESTIONS).map(t=><button key={t} onClick={()=>setQType(t)} className={`text-xs px-2.5 py-1 rounded-full transition ${qType===t?'bg-amber-100 text-amber-700 font-medium':'bg-stone-100 text-stone-600 hover:bg-stone-200'}`}>{t.charAt(0).toUpperCase()+t.slice(1)}</button>)}</div><div className="flex flex-wrap gap-2">{suggestions.map(s=>{const used=questions.some(q=>q.question===s);return <button key={s} onClick={()=>applySuggestion(s)} disabled={questions.length>=3||used} className="text-xs px-2.5 py-1 bg-stone-50 border border-stone-200 rounded-full hover:bg-amber-50 hover:border-amber-200 disabled:opacity-40 disabled:cursor-not-allowed transition">{used?'✓ ':'+ '}{s}</button>;})}</div></div></Card>;
    }

    // ── Features Card (shared) ──────────────────────────────────
    function FeaturesCard({roomPreview,setRoomPreview,badges,setBadges,lobby,setLobby}) {
      return <Card className="p-5 space-y-4"><h2 className="font-semibold text-stone-900">Features</h2><Toggle label="Room Preview" checked={roomPreview} onChange={setRoomPreview} helper="Opted-in attendees can see who else is coming."/><Toggle label="Return Recognition" checked={badges} onChange={setBadges} helper="Returning attendees get a welcome-back message."/><Toggle label="Post-event Lobby" checked={lobby} onChange={setLobby} helper="After the event, attendees can give merit for 48 hours."/></Card>;
    }

    // ── Dashboard ────────────────────────────────────────────────
    function Dashboard({profile,userId,events,series,onCreateEvent,onCreateSeries,onSelectEvent,onSelectSeries,onGoRoster,onGoPackages,onSignOut,initialTab}) {
      const [tab,setTab]=useState(initialTab||'events');
      const handleTab=(t)=>{if(t==='roster'){onGoRoster();return;}if(t==='packages'){onGoPackages();return;}setTab(t);};
      return <div className="min-h-screen bg-stone-50"><header className="bg-white border-b border-stone-200"><div className="px-4 py-3 flex items-center justify-between"><span className="font-bold text-stone-900 text-lg">🌀 Gather Again</span><div className="flex items-center gap-3">{profile?.avatar_url&&<img src={profile.avatar_url} className="w-7 h-7 rounded-full object-cover"/>}<span className="text-sm text-stone-600 hidden sm:block">{profile?.display_name}</span><Btn variant="ghost" size="sm" onClick={onSignOut}>Sign out</Btn></div></div><div className="flex border-t border-stone-100">{[['events','Events'],['series','Series'],['roster','Roster'],['packages','Packages']].map(([t,l])=><button key={t} onClick={()=>handleTab(t)} className={`flex-1 py-2.5 text-xs font-medium transition-colors ${tab===t?'text-amber-600 border-b-2 border-amber-500':'text-stone-500 hover:text-stone-800'}`}>{l}</button>)}</div></header>
      <div className="max-w-2xl mx-auto px-4 py-6">{tab==='events'&&<div className="fade-in"><div className="flex items-center justify-between mb-6"><h2 className="text-xl font-bold text-stone-900">Your Events</h2><Btn onClick={onCreateEvent}>+ New Event</Btn></div>{events.length===0?<Card className="p-12 text-center"><div className="text-4xl mb-3">🎪</div><h3 className="font-semibold text-stone-900 mb-1">No events yet</h3><p className="text-stone-500 text-sm mb-4">Create your first event to start gathering.</p><Btn onClick={onCreateEvent}>Create an event</Btn></Card>:<div className="space-y-3">{events.map(ev=><Card key={ev.id} className="p-4 hover:border-amber-300 cursor-pointer transition-colors" onClick={()=>onSelectEvent(ev)}><div className="flex items-start justify-between gap-3"><div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap mb-0.5"><h3 className="font-semibold text-stone-900 truncate">{ev.title}</h3><Badge color={STATUS_COLORS[ev.status]}>{STATUS_LABELS[ev.status]}</Badge>{ev.series_id&&<Badge color="blue">Series</Badge>}{ev.capacity&&<Badge color="stone">Cap {ev.capacity}</Badge>}</div><p className="text-sm text-stone-500">{fmtDate(ev.event_date)}</p>{ev.location&&<p className="text-sm text-stone-500">📍 {ev.location}</p>}</div><svg className="w-5 h-5 text-stone-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7"/></svg></div></Card>)}</div>}</div>}
      {tab==='series'&&<div className="fade-in"><div className="flex items-center justify-between mb-6"><h2 className="text-xl font-bold text-stone-900">Your Series</h2><Btn onClick={onCreateSeries}>+ New Series</Btn></div>{series.length===0?<Card className="p-12 text-center"><div className="text-4xl mb-3">🔁</div><h3 className="font-semibold text-stone-900 mb-1">No series yet</h3><p className="text-stone-500 text-sm mb-4">Series let you create recurring events from a template.</p><Btn onClick={onCreateSeries}>Create a series</Btn></Card>:<div className="space-y-3">{series.map(s=>{const count=events.filter(e=>e.series_id===s.id).length;return <Card key={s.id} className="p-4 hover:border-amber-300 cursor-pointer transition-colors" onClick={()=>onSelectSeries(s)}><div className="flex items-start justify-between gap-3"><div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap mb-0.5"><h3 className="font-semibold text-stone-900 truncate">{s.title}</h3>{!s.is_active&&<Badge color="stone">Archived</Badge>}{s.capacity&&<Badge color="stone">Cap {s.capacity}</Badge>}</div><p className="text-sm text-stone-500">{count} event{count!==1?'s':''} created</p>{s.location&&<p className="text-sm text-stone-500">📍 {s.location}</p>}</div><svg className="w-5 h-5 text-stone-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7"/></svg></div></Card>;})}</div>}</div>}</div></div>;
    }

    // ── Series Form ──────────────────────────────────────────────
    function SeriesFormPage({userId,existing,onSave,onBack}) {
      const [title,setTitle]=useState(existing?.title||'');const [desc,setDesc]=useState(existing?.description||'');const [loc,setLoc]=useState(existing?.location||'');const [cap,setCap]=useState(existing?.capacity||'');
      const [questions,setQuestions]=useState(existing?.custom_questions?.length?existing.custom_questions:[{id:'1',question:"What's your superpower?"}]);
      const [roomPreview,setRoomPreview]=useState(existing?.room_preview_enabled??true);const [badges,setBadges]=useState(existing?.badges_enabled??true);const [lobby,setLobby]=useState((existing?.lobby_duration_hours??24)>0);
      const [qType,setQType]=useState('networking');const [saving,setSaving]=useState(false);const [err,setErr]=useState(null);
      const save=async()=>{if(!title.trim()){setErr('Title is required.');return;}setSaving(true);setErr(null);try{const payload={host_id:userId,title:title.trim(),description:desc.trim()||null,location:loc.trim()||null,capacity:cap?parseInt(cap):null,custom_questions:questions.filter(q=>q.question.trim()),room_preview_enabled:roomPreview,badges_enabled:badges,lobby_duration_hours:lobby?24:0};let result;if(existing){const{data,error}=await sb.from('ga_series').update(payload).eq('id',existing.id).select().single();if(error)throw error;result=data;}else{const{data,error}=await sb.from('ga_series').insert(payload).select().single();if(error)throw error;result=data;}onSave(result);}catch(e){setErr(e.message);setSaving(false);}};
      return <div className="min-h-screen bg-stone-50"><header className="bg-white border-b border-stone-200 px-4 py-3 flex items-center gap-3"><BackBtn onClick={onBack}/><h1 className="font-semibold text-stone-900">{existing?'Edit Series':'New Series'}</h1></header><div className="max-w-lg mx-auto px-4 py-6 space-y-5 fade-in"><Card className="p-5 space-y-4"><h2 className="font-semibold text-stone-900">Series Details</h2><Field label="Title *"><TextInput value={title} onChange={setTitle} placeholder="Tuesday Training"/></Field><Field label="Description"><textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="What's this series about?" className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 h-20 resize-none"/></Field><div className="grid grid-cols-2 gap-3"><Field label="Location"><TextInput value={loc} onChange={setLoc} placeholder="Venue or address"/></Field><Field label="Capacity" helper="Leave blank for unlimited"><TextInput type="number" value={cap} onChange={setCap} placeholder="e.g. 20"/></Field></div></Card><QuestionsCard questions={questions} setQuestions={setQuestions} qType={qType} setQType={setQType}/><FeaturesCard roomPreview={roomPreview} setRoomPreview={setRoomPreview} badges={badges} setBadges={setBadges} lobby={lobby} setLobby={setLobby}/>{err&&<p className="text-red-500 text-sm px-1">{err}</p>}<div className="flex gap-3 pb-8"><Btn variant="secondary" onClick={onBack} className="flex-1">Cancel</Btn><Btn onClick={save} disabled={saving} className="flex-1">{saving?'Saving…':existing?'Save Changes':'Create Series'}</Btn></div></div></div>;
    }

    // ── Series Detail ────────────────────────────────────────────
    function SeriesDetailPage({series,events,onBack,onEdit,onNewInstance,onSelectEvent}) {
      const [creating,setCreating]=useState(false);const [date,setDate]=useState('');const [toast,setToast]=useState(null);
      const seriesEvents=events.filter(e=>e.series_id===series.id).sort((a,b)=>(b.instance_number||0)-(a.instance_number||0));
      const create=async()=>{setCreating(true);try{const{data,error}=await sb.rpc('create_series_instance',{p_series_id:series.id,p_event_date:date?new Date(date).toISOString():null});if(error)throw error;if(data?.error){setToast(data.error);setCreating(false);return;}onNewInstance(data);}catch(e){setToast(e.message||'Failed to create instance');setCreating(false);}};
      return <div className="min-h-screen bg-stone-50">{toast&&<Toast message={toast} onClose={()=>setToast(null)}/>}<header className="bg-white border-b border-stone-200 px-4 py-3 flex items-center gap-3"><BackBtn onClick={onBack}/><div className="flex-1 min-w-0"><h1 className="font-semibold text-stone-900 truncate">{series.title}</h1><p className="text-xs text-stone-500">{seriesEvents.length} event{seriesEvents.length!==1?'s':''}</p></div><Btn variant="ghost" size="sm" onClick={onEdit}>Edit</Btn></header><div className="max-w-2xl mx-auto px-4 py-6 space-y-5 fade-in"><Card className="p-5 space-y-4"><h2 className="font-semibold text-stone-900">New Instance</h2><Field label="Date & Time (optional)"><TextInput type="datetime-local" value={date} onChange={setDate}/></Field><Btn onClick={create} disabled={creating}>{creating?'Creating…':'Create Next Instance'}</Btn></Card><div className="space-y-3">{seriesEvents.map(ev=><Card key={ev.id} className="p-4 hover:border-amber-300 cursor-pointer transition-colors" onClick={()=>onSelectEvent(ev)}><div className="flex items-center justify-between gap-3"><div><div className="flex items-center gap-2 mb-0.5"><span className="font-medium text-stone-900">{ev.title}</span><Badge color={STATUS_COLORS[ev.status]}>{STATUS_LABELS[ev.status]}</Badge></div><p className="text-sm text-stone-500">{fmtDate(ev.event_date)}</p></div><svg className="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7"/></svg></div></Card>)}</div></div></div>;

    // ── Create Event ─────────────────────────────────────────────
    function CreateEventPage({userId,series,onSave,onBack}) {
      const [title,setTitle]=useState('');const [desc,setDesc]=useState('');const [date,setDate]=useState('');const [loc,setLoc]=useState('');const [cap,setCap]=useState('');const [seriesId,setSeriesId]=useState('');
      const [questions,setQuestions]=useState([{id:'1',question:"What's your superpower?"}]);const [roomPreview,setRoomPreview]=useState(true);const [badges,setBadges]=useState(true);const [lobby,setLobby]=useState(true);

      const save=async()=>{if(!title.trim()){setErr('Title is required.');return;}setSaving(true);setErr(null);try{let instNum=null;if(seriesId){const{data:mx}=await sb.from('ga_events').select('instance_number').eq('series_id',seriesId).order('instance_number',{ascending:false}).limit(1);instNum=(mx?.[0]?.instance_number||0)+1;}const{data:ev,error:e}=await sb.from('ga_events').insert({host_id:userId,title:title.trim(),description:desc.trim()||null,event_date:date?new Date(date).toISOString():null,location:loc.trim()||null,slug:slugify(title),capacity:cap?parseInt(cap):null,custom_questions:questions.filter(q=>q.question.trim()),room_preview_enabled:roomPreview,badges_enabled:badges,lobby_duration_hours:lobby?24:0,series_id:seriesId||null,instance_number:instNum}).select().single();if(e)throw e;onSave(ev);}catch(e){setErr(e.message);setSaving(false);}};
      return <div className="min-h-screen bg-stone-50"><header className="bg-white border-b border-stone-200 px-4 py-3 flex items-center gap-3"><BackBtn onClick={onBack}/><h1 className="font-semibold text-stone-900">New Event</h1></header><div className="max-w-lg mx-auto px-4 py-6 space-y-5 fade-in">{series.length>0&&<Card className="p-5 space-y-3"><Field label="Part of a series?" helper="Inherit settings from a series template"><select value={seriesId} onChange={e=>pickSeries(e.target.value)} className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white"><option value="">Standalone event</option>{series.filter(s=>s.is_active).map(s=><option key={s.id} value={s.id}>{s.title}</option>)}</select></Field></Card>}<Card className="p-5 space-y-4"><h2 className="font-semibold text-stone-900">Event Details</h2><Field label="Title *"><TextInput value={title} onChange={setTitle} placeholder="Summer Networking Night"/></Field><Field label="Description"><textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="What's this event about?" className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 h-20 resize-none"/></Field><div className="grid grid-cols-2 gap-3"><Field label="Date & Time"><TextInput type="datetime-local" value={date} onChange={setDate}/></Field><Field label="Location"><TextInput value={loc} onChange={setLoc} placeholder="Venue or address"/></Field></div><Field label="Capacity" helper="Leave blank for unlimited"><TextInput type="number" value={cap} onChange={setCap} placeholder="e.g. 20"/></Field></Card><QuestionsCard questions={questions} setQuestions={setQuestions} qType={qType} setQType={setQType}/><FeaturesCard roomPreview={roomPreview} setRoomPreview={setRoomPreview} badges={badges} setBadges={setBadges} lobby={lobby} setLobby={setLobby}/>{err&&<p className="text-red-500 text-sm px-1">{err}</p>}<div className="flex gap-3 pb-8"><Btn variant="secondary" onClick={onBack} className="flex-1">Cancel</Btn><Btn onClick={save} disabled={saving} className="flex-1">{saving?'Creating…':'Create Event'}</Btn></div></div></div>;
    }

    // ── Roster ───────────────────────────────────────────────────
    function RosterPage({userId,onBack,onSelectMember}) {
      const [roster,setRoster]=useState([]);const [loading,setLoading]=useState(true);const [search,setSearch]=useState('');const [filter,setFilter]=useState('all');const [rosterErr,setRosterErr]=useState(null);
      useEffect(()=>{sb.rpc('get_host_roster',{p_host_id:userId}).then(({data,error})=>{if(error){setRosterErr(error.message);setLoading(false);return;}setRoster(data||[]);setLoading(false);}).catch(e=>{setRosterErr(e.message||'Failed to load roster');setLoading(false);});},[userId]);
      const filtered=roster.filter(m=>{const q=search.toLowerCase();const nm=!q||(m.display_name||'').toLowerCase().includes(q)||(m.phone||'').includes(q);if(!nm)return false;if(filter==='active')return !m.is_drop_in;if(filter==='drop-in')return m.is_drop_in;if(filter==='over')return m.session_limit!=null&&(m.sessions_used||0)>=m.session_limit;return true;});

_used||0}/{m.session_limit||'∞'}</Badge>}</div><div className="text-xs text-stone-500">{fmtPhone(m.phone)} · {m.total_attendance} visit{m.total_attendance!==1?'s':''}{m.last_attended_at&&` · Last: ${fmtDateShort(m.last_attended_at)}`}</div>{m.host_notes&&<div className="text-xs text-stone-400 mt-0.5 italic">{m.host_notes}</div>}</div><svg className="w-5 h-5 text-stone-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7"/></svg></div></Card>;})}</div></div>;
    }

    // ── Member Detail ────────────────────────────────────────────
    function MemberDetailPage({member,userId,packages,onBack,onUpdate}) {
      const [notes,setNotes]=useState(member.host_notes||'');const [selectedPkg,setSelectedPkg]=useState('');const [cycleStart,setCycleStart]=useState(new Date().toISOString().slice(0,10));
      const [saving,setSaving]=useState(false);const [toast,setToast]=useState(null);const [history,setHistory]=useState(null);
      useEffect(()=>{sb.rpc('get_member_history',{p_member_id:member.member_id,p_host_id:userId}).then(({data})=>setHistory(data));},[member.member_id,userId]);
      const saveNotes=async()=>{setSaving(true);await sb.from('ga_host_members').update({host_notes:notes.trim()||null}).eq('id',member.host_member_id);setSaving(false);setToast('Notes saved');onUpdate();};
      const assignPackage=async()=>{if(!selectedPkg)return;setSaving(true);try{const pkg=packages.find(p=>p.id===selectedPkg);const start=new Date(cycleStart);const end=new Date(start);end.setDate(end.getDate()+(pkg?.cycle_length_days||30));const{error:expErr}=await sb.from('ga_member_packages').update({status:'expired'}).eq('host_member_id',member.host_member_id).eq('status','active');if(expErr)throw expErr;const{error:insErr}=await sb.from('ga_member_packages').insert({host_member_id:member.host_member_id,package_id:selectedPkg,cycle_start:cycleStart,cycle_end:end.toISOString().slice(0,10),status:'active'});if(insErr)throw insErr;setToast('Package assigned');setSelectedPkg('');onUpdate();sb.rpc('get_member_history',{p_member_id:member.member_id,p_host_id:userId}).then(({data})=>setHistory(data));}catch(e){setToast(e.message||'Failed to assign package');}setSaving(false);};
      const cycle=history?.cycle;
      return <div className="min-h-screen bg-stone-50">{toast&&<Toast message={toast} onClose={()=>setToast(null)}/>}<header className="bg-white border-b border-stone-200 px-4 py-3 flex items-center gap-3"><BackBtn onClick={onBack}/><div><h1 className="font-semibold text-stone-900">{member.display_name||'Anonymous'}</h1><p className="text-xs text-stone-500">{fmtPhone(member.phone)}</p></div></header><div className="max-w-lg mx-auto px-4 py-6 space-y-5 fade-in">
      <Card className="p-5"><div className="grid grid-cols-3 gap-4 text-center"><div><div className="text-2xl font-bold text-stone-900">{member.total_attendance}</div><div className="text-xs text-stone-500">Total visits</div></div><div><div className="text-2xl font-bold text-stone-900">{fmtDateShort(member.first_attended_at)}</div><div className="text-xs text-stone-500">First visit</div></div><div><div className="text-2xl font-bold text-stone-900">{fmtDateShort(member.last_attended_at)}</div><div className="text-xs text-stone-500">Last visit</div></div></div></Card>
      <Card className="p-5 space-y-4"><h2 className="font-semibold text-stone-900">Package</h2>{cycle?.has_package?<div className="space-y-2"><div className="flex items-center justify-between"><span className="text-sm font-medium text-stone-700">{cycle.package_name}</span><Badge color={statusColor(cycle.sessions_used,cycle.session_limit)}>{cycle.sessions_used}/{cycle.session_limit||'∞'} used</Badge></div>{cycle.session_limit&&<div className="w-full bg-stone-100 rounded-full h-2"><div className={`h-2 rounded-full transition-all ${statusColor(cycle.sessions_used,cycle.session_limit)==='red'?'bg-red-500':statusColor(cycle.sessions_used,cycle.session_limit)==='yellow'?'bg-yellow-500':'bg-green-500'}`} style={{width:`${Math.min((cycle.sessions_used/cycle.session_limit)*100,100)}%`}}/></div>}<p className="text-xs text-stone-500">Cycle: {fmtDateShort(cycle.cycle_start)} – {fmtDateShort(cycle.cycle_end)}</p></div>:<p className="text-sm text-stone-500">No active package — showing as drop-in.</p>}
      <div className="border-t border-stone-100 pt-4 space-y-3"><p className="text-xs font-medium text-stone-700">{cycle?.has_package?'Change':'Assign'} Package</p><select value={selectedPkg} onChange={e=>setSelectedPkg(e.target.value)} className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white"><option value="">Select a package…</option>{packages.filter(p=>p.is_active).map(p=><option key={p.id} value={p.id}>{p.name} ({p.session_limit||'∞'} sessions / {p.cycle_length_days} days)</option>)}</select><Field label="Cycle start date"><TextInput type="date" value={cycleStart} onChange={setCycleStart}/></Field><Btn variant="secondary" onClick={assignPackage} disabled={!selectedPkg||saving}>{saving?'Saving…':'Assign Package'}</Btn></div></Card>
      <Card className="p-5 space-y-3"><h2 className="font-semibold text-stone-900">Host Notes</h2><textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Private notes about this member…" className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 h-20 resize-none"/><Btn variant="secondary" onClick={saveNotes} disabled={saving}>{saving?'Saving…':'Save Notes'}</Btn></Card>
      <Card className="p-5 space-y-3"><h2 className="font-semibold text-stone-900">Attendance History</h2>{!history?<div className="text-stone-400 text-sm">Loading…</div>:history.history?.length===0?<p className="text-sm text-stone-500">No attendance records.</p>:<div className="space-y-2 max-h-64 overflow-y-auto">{(history.history||[]).map((h,i)=><div key={i} className="flex items-center justify-between text-sm py-1.5 border-b border-stone-50 last:border-0"><div><span className="text-stone-700">{h.event_title}</span>{h.series_title&&<span className="text-stone-400 text-xs ml-1">({h.series_title})</span>}</div><div className="flex items-center gap-2">{h.is_drop_in&&<Badge color="stone">Drop-in</Badge>}<span className="text-xs text-stone-500">{fmtDateShort(h.event_date||h.checked_in_at)}</span></div></div>)}</div>}</Card>
      </div></div>;
    }

    // ── Packages ─────────────────────────────────────────────────
    function PackagesPage({userId,onBack}) {
      const [packages,setPackages]=useState([]);const [loading,setLoading]=useState(true);const [showForm,setShowForm]=useState(false);const [editing,setEditing]=useState(null);
      const [name,setName]=useState('');const [limit,setLimit]=useState('');const [days,setDays]=useState('30');const [saving,setSaving]=useState(false);const [toast,setToast]=useState(null);
      const load=async()=>{const{data}=await sb.from('ga_packages').select('*').eq('host_id',userId).order('created_at');setPackages(data||[]);setLoading(false);};
      useEffect(()=>{load();},[userId]);
      const openNew=()=>{setEditing(null);setName('');setLimit('');setDays('30');setShowForm(true);};
      const openEdit=(p)=>{setEditing(p);setName(p.name);setLimit(p.session_limit||'');setDays(String(p.cycle_length_days));setShowForm(true);};
      const save=async()=>{if(!name.trim())return;setSaving(true);try{const payload={host_id:userId,name:name.trim(),session_limit:limit?parseInt(limit):null,cycle_length_days:parseInt(days)||30};if(editing){const{error}=await sb.from('ga_packages').update(payload).eq('id',editing.id);if(error)throw error;}else{const{error}=await sb.from('ga_packages').insert(payload);if(error)throw error;}setShowForm(false);setToast(editing?'Package updated':'Package created');load();}catch(e){setToast(e.message||'Failed to save package');}setSaving(false);};
      const toggleActive=async(p)=>{await sb.from('ga_packages').update({is_active:!p.is_active}).eq('id',p.id);setToast(p.is_active?'Package retired':'Package reactivated');load();};
      return <div className="min-h-screen bg-stone-50">{toast&&<Toast message={toast} onClose={()=>setToast(null)}/>}<header className="bg-white border-b border-stone-200 px-4 py-3 flex items-center gap-3"><BackBtn onClick={onBack}/><h1 className="font-semibold text-stone-900">Packages</h1><Btn size="sm" onClick={openNew} className="ml-auto">+ New Package</Btn></header><div className="max-w-lg mx-auto px-4 py-6 space-y-4 fade-in">{showForm&&<Card className="p-5 space-y-4 border-amber-200"><h2 className="font-semibold text-stone-900">{editing?'Edit Package':'New Package'}</h2><Field label="Name *"><TextInput value={name} onChange={setName} placeholder="5-Session Monthly"/></Field><div className="grid grid-cols-2 gap-3"><Field label="Session limit" helper="Blank = unlimited"><TextInput type="number" value={limit} onChange={setLimit} placeholder="e.g. 5"/></Field><Field label="Cycle length (days)"><TextInput type="number" value={days} onChange={setDays} placeholder="30"/></Field></div><div className="flex gap-2"><Btn variant="secondary" onClick={()=>setShowForm(false)} className="flex-1">Cancel</Btn><Btn onClick={save} disabled={saving||!name.trim()} className="flex-1">{saving?'Saving…':'Save'}</Btn></div></Card>}{loading?<div className="text-center py-12 text-stone-400">Loading…</div>:packages.length===0&&!showForm?<Card className="p-12 text-center"><div className="text-4xl mb-3">📦</div><h3 className="font-semibold text-stone-900 mb-1">No packages yet</h3><p className="text-stone-500 text-sm mb-4">Packages let you track session-based memberships.</p><Btn onClick={openNew}>Create a package</Btn></Card>:packages.map(p=><Card key={p.id} className={`p-4 ${!p.is_active?'opacity-60':''}`}><div className="flex items-center justify-between gap-3"><div><div className="flex items-center gap-2"><span className="font-medium text-stone-900">{p.name}</span>{!p.is_active&&<Badge color="stone">Retired</Badge>}</div><div className="text-xs text-stone-500 mt-0.5">{p.session_limit||'Unlimited'} sessions · {p.cycle_length_days}-day cycle</div></div><div className="flex gap-1"><Btn variant="ghost" size="sm" onClick={()=>openEdit(p)}>Edit</Btn><Btn variant="ghost" size="sm" onClick={()=>toggleActive(p)}>{p.is_active?'Retire':'Reactivate'}</Btn></div></div></Card>)}</div></div>;
    }

    // ── Event Detail ─────────────────────────────────────────────
    function EventDetailPage({event:initEvent,onBack,onEventUpdate,onDuplicate}) {
      const [event,setEvent]=useState(initEvent||{});const [tab,setTab]=useState('attendees');const [attendees,setAtt]=useState([]);const [loading,setLoading]=useState(true);
      const [search,setSearch]=useState('');const [updating,setUpdating]=useState(false);const [toast,setToast]=useState(null);const [smsLoading,setSmsLoading]=useState(false);const [bulkConfirm,setBulkConfirm]=useState(false);
      const qrRef=useRef(null);const qrObj=useRef(null);
      const attendUrl=initEvent?`${ATTEND_BASE}?e=${event.slug}`:'';
      const fetchAttendees=useCallback(async()=>{if(!initEvent)return;const{data}=await sb.from('ga_attendances').select('*, members:ga_members(id, name, phone)').eq('event_id',event.id).order('created_at',{ascending:false});setAtt(data||[]);setLoading(false);},[initEvent,event.id]);
      useEffect(()=>{if(!initEvent)return;fetchAttendees();const channel=sb.channel(`att-${event.id}`).on('postgres_changes',{event:'*',schema:'public',table:'ga_attendances',filter:`event_id=eq.${event.id}`},()=>fetchAttendees()).subscribe();return()=>sb.removeChannel(channel);},[initEvent,fetchAttendees]);
      useEffect(()=>{if(!initEvent||tab!=='qr'||!qrRef.current)return;if(qrObj.current){try{qrObj.current.clear();}catch{}qrObj.current=null;}qrRef.current.innerHTML='';const timer=setTimeout(()=>{if(qrRef.current&&!qrObj.current){qrObj.current=new QRCode(qrRef.current,{text:attendUrl,width:220,height:220,colorDark:'#1c1917',colorLight:'#ffffff'});}},80);return()=>clearTimeout(timer);},[initEvent,tab,attendUrl]);
      if(!initEvent)return <div className="min-h-screen bg-stone-50 flex items-center justify-center"><div className="text-stone-400 text-sm">Loading event…</div></div>;

      const STATUS_FORWARD={upcoming:{label:'Go Live',next:'active',variant:'success'},active:{label:'Open Lobby',next:'lobby',variant:'primary'},lobby:{label:'Close Event',next:'closed',variant:'secondary'},closed:null};
      const STATUS_BACK={upcoming:null,active:{label:'← Upcoming',next:'upcoming'},lobby:{label:'← Live',next:'active'},closed:{label:'← Reopen Lobby',next:'lobby'}};
      const updateStatus=async(next)=>{setUpdating(true);const updates={status:next};if(next==='closed')updates.closed_at=new Date().toISOString();if(next==='lobby'&&event.status==='closed'){updates.closed_at=null;}if(next==='active'&&event.status==='lobby'){updates.lobby_sms_sent_at=null;}const{data}=await sb.from('ga_events').update(updates).eq('id',event.id).select().single();if(data){setEvent(data);onEventUpdate(data);}setUpdating(false);};
      const checkIn=async(id)=>{const{data}=await sb.from('ga_attendances').update({checked_in:true,checked_in_at:new Date().toISOString()}).eq('id',id).select('*, members:ga_members(id, name, phone)').single();if(data)setAtt(prev=>prev.map(a=>a.id===id?data:a));};
      const uncheckIn=async(id)=>{const{data}=await sb.from('ga_attendances').update({checked_in:false,checked_in_at:null}).eq('id',id).select('*, members:ga_members(id, name, phone)').single();if(data)setAtt(prev=>prev.map(a=>a.id===id?data:a));};
      const bulkCheckIn=async()=>{if(!bulkConfirm){setBulkConfirm(true);return;}setBulkConfirm(false);const unchecked=filtered.filter(a=>!a.checked_in);for(const a of unchecked){await checkIn(a.id);}setToast(`Checked in ${unchecked.length} attendee${unchecked.length!==1?'s':''}`);};
      const sendSMS=async()=>{setSmsLoading(true);try{const{data,error}=await sb.functions.invoke('lobby-sms',{body:{event_id:event.id}});if(error)throw error;const{data:updated}=await sb.from('ga_events').update({lobby_sms_sent_at:new Date().toISOString()}).eq('id',event.id).select().single();if(updated){setEvent(updated);onEventUpdate(updated);}const sent=data?.sent||0;setToast(`SMS sent to ${sent} attendee${sent!==1?'s':''}`);}catch(e){setToast(e.message||'Failed to send SMS');}setSmsLoading(false);};
      const [dupConfirm,setDupConfirm]=useState(false);
      const doDuplicate=async()=>{if(!dupConfirm){setDupConfirm(true);setTimeout(()=>setDupConfirm(false),3000);return;}setDupConfirm(false);try{const{data,error}=await sb.rpc('duplicate_event',{p_event_id:event.id});if(error)throw error;if(data?.error){setToast(data.error);return;}setToast('Event duplicated!');if(onDuplicate)onDuplicate(data);}catch(e){setToast(e.message||'Failed to duplicate event');}};

      const filtered=attendees.filter(a=>{if(!search.trim())return true;const q=search.toLowerCase();return(a.members?.name||'').toLowerCase().includes(q)||(a.members?.phone||'').includes(q);});
      const checkedCount=attendees.filter(a=>a.checked_in).length;const meritTotal=attendees.reduce((s,a)=>s+(a.merit_received||0),0);const uncheckedFiltered=filtered.filter(a=>!a.checked_in).length;
      const fwd=STATUS_FORWARD[event.status];const back=STATUS_BACK[event.status];
      const canSendSMS=(event.status==='lobby'||(event.status==='closed'&&event.closed_at&&new Date(event.closed_at).getTime()+48*60*60*1000>Date.now()))&&!event.lobby_sms_sent_at;
      const TABS=[['attendees','Attendees'],['checkin','Check-in'],['qr','QR Code'],['settings','Settings']];
      const switchTab=(t)=>{setTab(t);setBulkConfirm(false);};

      return <div className="min-h-screen bg-stone-50">{toast&&<Toast message={toast} onClose={()=>setToast(null)}/>}
      <header className="bg-white border-b border-stone-200 sticky top-0 z-10"><div className="px-4 py-3 flex items-center gap-3"><BackBtn onClick={onBack}/><div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap"><h1 className="font-semibold text-stone-900 truncate">{event.title}</h1><Badge color={STATUS_COLORS[event.status]}>{STATUS_LABELS[event.status]}</Badge>{event.series_id&&<Badge color="blue">Series</Badge>}</div>{event.event_date&&<p className="text-xs text-stone-500">{fmtDate(event.event_date)}</p>}</div><div className="flex items-center gap-1.5">{back&&<Btn variant="ghost" size="sm" onClick={()=>updateStatus(back.next)} disabled={updating}>{back.label}</Btn>}{fwd&&<Btn variant={fwd.variant} size="sm" onClick={()=>updateStatus(fwd.next)} disabled={updating}>{updating?'…':fwd.label}</Btn>}</div></div>
      <div className="px-4 pb-3 flex items-center justify-between"><div className="flex gap-5 text-sm"><span><strong className="text-stone-900">{attendees.length}</strong>{event.capacity?<span className="text-stone-400">/{event.capacity}</span>:null}<span className="text-stone-400"> registered</span></span><span><strong className="text-green-600">{checkedCount}</strong> <span className="text-stone-400">checked in</span></span><span><strong className="text-purple-600">{meritTotal}</strong> <span className="text-stone-400">merit</span></span>{event.lobby_hearts>0&&<span><strong className="text-red-500">{event.lobby_hearts}</strong> <span className="text-stone-400">❤️</span></span>}</div>{canSendSMS&&<Btn variant="secondary" size="sm" onClick={sendSMS} disabled={smsLoading}>{smsLoading?'Sending…':`📱 Notify (${checkedCount})`}</Btn>}{event.lobby_sms_sent_at&&<span className="text-xs text-stone-400">SMS sent ✓</span>}</div>
      <div className="flex border-t border-stone-100">{TABS.map(([t,l])=><button key={t} onClick={()=>switchTab(t)} className={`flex-1 py-2.5 text-xs font-medium transition-colors ${tab===t?'text-amber-600 border-b-2 border-amber-500':'text-stone-500 hover:text-stone-800'}`}>{l}</button>)}</div></header>

      {tab==='attendees'&&<div className="max-w-2xl mx-auto px-4 py-4 space-y-3 fade-in"><div className="flex gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name or phone…" className="flex-1 px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white"/>{attendees.length>0&&<Btn variant="secondary" size="sm" onClick={()=>exportCSV(attendees,event)}>Export CSV</Btn>}</div>{loading?<div className="text-center py-12 text-stone-400">Loading…</div>:filtered.length===0?<div className="text-center py-12"><div className="text-3xl mb-2">🪑</div><p className="text-stone-500 text-sm">{search?'No matches.':'No registrations yet. Share the QR code!'}</p></div>:filtered.map(a=><Card key={a.id} className="p-4"><div className="flex items-start justify-between gap-3"><div className="flex-1 min-w-0"><div className="flex items-center gap-2 flex-wrap mb-0.5"><span className="font-medium text-stone-900">{a.members?.name||'Anonymous'}</span>{a.checked_in&&<Badge color="green">✓ Checked in</Badge>}{a.merit_received>0&&<Badge color="purple">⭐ {a.merit_received}</Badge>}{!a.opt_in_preview&&<Badge color="stone">Preview opt-out</Badge>}{!a.member_package_id&&<Badge color="stone">Drop-in</Badge>}</div><div className="text-xs text-stone-500">{fmtPhone(a.members?.phone)}</div>{(event.custom_questions||[]).map(q=>a.answers?.[q.id]?<div key={q.id} className="text-xs mt-1.5"><span className="text-stone-400">{q.question}: </span><span className="text-stone-700">{a.answers[q.id]}</span></div>:null)}</div><div className="flex items-center gap-1.5 flex-shrink-0">{a.checked_in?<Btn variant="ghost-danger" size="sm" onClick={()=>uncheckIn(a.id)}>Undo</Btn>:(event.status==='active'||event.status==='lobby')?<Btn variant="success" size="sm" onClick={()=>checkIn(a.id)}>Check in</Btn>:null}</div></div></Card>)}</div>}

      {tab==='checkin'&&<div className="max-w-lg mx-auto px-4 py-4 space-y-3 fade-in"><div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-sm text-amber-800">At-door mode. Search or scroll. Tap to check someone in.{event.status==='upcoming'&&' Set event to "Live" first.'}</div><div className="flex gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name…" autoFocus className="flex-1 px-4 py-3 text-base border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white"/>{uncheckedFiltered>0&&<button onClick={bulkCheckIn} className={`px-4 py-3 rounded-xl text-sm font-medium transition flex-shrink-0 ${bulkConfirm?'bg-green-500 text-white hover:bg-green-600':'bg-stone-100 text-stone-700 hover:bg-stone-200'}`}>{bulkConfirm?`Confirm (${uncheckedFiltered})`:`All (${uncheckedFiltered})`}</button>}</div><div className="space-y-2">{(filtered.length===0&&!loading)&&<p className="text-center text-stone-400 text-sm py-6">{search?'No match found.':'No registrations yet.'}</p>}{filtered.map(a=><div key={a.id} className={`flex items-center justify-between gap-3 rounded-xl border p-4 transition ${a.checked_in?'bg-green-50 border-green-200':'bg-white border-stone-200'}`}><div><div className="font-medium text-stone-900">{a.members?.name||fmtPhone(a.members?.phone)||'—'}</div>{a.members?.name&&<div className="text-xs text-stone-500">{fmtPhone(a.members?.phone)}</div>}</div>{a.checked_in?<div className="flex items-center gap-2"><span className="text-green-600 font-medium text-sm">✓ In</span><Btn variant="ghost-danger" size="sm" onClick={()=>uncheckIn(a.id)}>Undo</Btn></div>:<Btn variant="success" onClick={()=>checkIn(a.id)}>Check in ✓</Btn>}</div>)}</div></div>}

      {tab==='qr'&&<div className="max-w-sm mx-auto px-4 py-8 text-center space-y-5 fade-in"><div><h2 className="font-semibold text-stone-900 mb-1">Attendee Check-in</h2><p className="text-sm text-stone-500">Display this QR at the door or share the link.</p></div><Card className="p-8 flex flex-col items-center gap-4"><div ref={qrRef}/><p className="text-xs text-stone-400 break-all">{attendUrl}</p></Card><div className="flex gap-3"><Btn variant="secondary" className="flex-1" onClick={()=>navigator.clipboard.writeText(attendUrl).then(()=>setToast('Link copied!'))}>Copy Link</Btn><Btn variant="secondary" className="flex-1" onClick={()=>window.print()}>Print</Btn></div></div>}

      {tab==='settings'&&<EventSettings event={event} onUpdate={ev=>{setEvent(ev);onEventUpdate(ev);}} onDuplicate={doDuplicate} dupConfirm={dupConfirm}/>}
      </div>;
    }

    function EventSettings({event,onUpdate,onDuplicate,dupConfirm}) {
      const [title,setTitle]=useState(event.title);const [desc,setDesc]=useState(event.description||'');const [loc,setLoc]=useState(event.location||'');const [cap,setCap]=useState(event.capacity!=null?String(event.capacity):'');
      const [saving,setSaving]=useState(false);const [saved,setSaved]=useState(false);const [err,setErr]=useState(null);
      const save=async()=>{setSaving(true);setErr(null);try{const{data,error}=await sb.from('ga_events').update({title,description:desc||null,location:loc||null,capacity:cap?parseInt(cap):null}).eq('id',event.id).select().single();if(error)throw error;if(data){onUpdate(data);setSaved(true);setTimeout(()=>setSaved(false),2000);}}catch(e){setErr(e.message||'Failed to save');}setSaving(false);};
      return <div className="max-w-lg mx-auto px-4 py-4 space-y-4 fade-in"><Card className="p-5 space-y-4"><h2 className="font-semibold text-stone-900">Edit Event</h2><Field label="Title"><TextInput value={title} onChange={setTitle}/></Field><Field label="Description"><textarea value={desc} onChange={e=>setDesc(e.target.value)} className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 h-20 resize-none"/></Field><div className="grid grid-cols-2 gap-3"><Field label="Location"><TextInput value={loc} onChange={setLoc}/></Field><Field label="Capacity" helper="Blank = unlimited"><TextInput type="number" value={cap} onChange={setCap} placeholder="e.g. 20"/></Field></div>{err&&<p className="text-red-500 text-sm">{err}</p>}<Btn onClick={save} disabled={saving}>{saved?'✓ Saved':saving?'Saving…':'Save Changes'}</Btn></Card>
      <Card className="p-5 space-y-2"><h2 className="font-semibold text-stone-900 mb-3">Event Info</h2>{[['Slug',<code className="text-xs bg-stone-100 px-1.5 py-0.5 rounded">{event.slug}</code>],['Status',STATUS_LABELS[event.status]],['Capacity',event.capacity||'Unlimited'],['Series',event.series_id?`Instance #${event.instance_number||'?'}`:'Standalone'],['Room Preview',event.room_preview_enabled?'On':'Off'],['Return Badges',event.badges_enabled?'On':'Off'],['Lobby',event.lobby_duration_hours>0?`${event.lobby_duration_hours}h after event`:'Off'],['Hearts',event.lobby_hearts||0]].map(([k,v])=><div key={k} className="flex items-center gap-2 text-sm"><span className="text-stone-400 w-28 flex-shrink-0">{k}</span><span className="text-stone-700">{v}</span></div>)}</Card>
      <Card className="p-5 space-y-3"><h2 className="font-semibold text-stone-900">Actions</h2><Btn variant={dupConfirm?'danger':'secondary'} onClick={onDuplicate} className="w-full">{dupConfirm?'Confirm Duplicate':'Duplicate Event'}</Btn><p className="text-xs text-stone-400">{dupConfirm?'Click again to confirm. Creates a copy in Upcoming status.':'Creates a copy with all settings, in Upcoming status.'}</p></Card></div>;
    }

    // ── Main App ─────────────────────────────────────────────────
    function App() {
      const [view,setView]=useState('loading');const [user,setUser]=useState(null);const [profile,setProfile]=useState(null);
      const [events,setEvents]=useState([]);const [series,setSeries]=useState([]);const [packages,setPackages]=useState([]);
      const [currentEvent,setCurrentEv]=useState(null);const [currentSeries,setCurrentSeries]=useState(null);const [currentMember,setCurrentMember]=useState(null);
      const [lastTab,setLastTab]=useState('events');

      const loadProfile=async(uid,userMeta)=>{const{data:p}=await sb.from('ga_profiles').select('*').eq('id',uid).single();if(p){setProfile(p);return;}const{data:ins}=await sb.from('ga_profiles').insert({id:uid,display_name:userMeta?.full_name||userMeta?.name||uid.slice(0,8),email:userMeta?.email,avatar_url:userMeta?.avatar_url}).select().single();setProfile(ins||{id:uid});};
      const loadEvents=async(uid)=>{const{data}=await sb.from('ga_events').select('*').eq('host_id',uid).order('created_at',{ascending:false});setEvents(data||[]);};
      const loadSeries=async(uid)=>{const{data}=await sb.from('ga_series').select('*').eq('host_id',uid).order('created_at',{ascending:false});setSeries(data||[]);};
      const loadPackages=async(uid)=>{const{data}=await sb.from('ga_packages').select('*').eq('host_id',uid).order('created_at');setPackages(data||[]);};
      const loadAll=(uid)=>{loadEvents(uid);loadSeries(uid);loadPackages(uid);};

      useEffect(()=>{sb.auth.getSession().then(({data:{session}})=>{if(session){setUser(session.user);loadProfile(session.user.id,session.user.user_metadata);loadAll(session.user.id);setView('dashboard');}else{setView('auth');}});const{data:{subscription}}=sb.auth.onAuthStateChange((evt,session)=>{if(session&&evt==='SIGNED_IN'){setUser(session.user);loadProfile(session.user.id,session.user.user_metadata);loadAll(session.user.id);setView('dashboard');}else if(evt==='SIGNED_OUT'){setUser(null);setProfile(null);setEvents([]);setSeries([]);setPackages([]);setCurrentEv(null);setCurrentSeries(null);setView('auth');}});return()=>subscription.unsubscribe();},[]);

      if(view==='loading')return <div className="min-h-screen bg-stone-50 flex items-center justify-center"><div className="text-stone-400 text-sm">Loading…</div></div>;
      if(view==='auth')return <AuthPage/>;
      if(view==='create')return <CreateEventPage userId={user.id} series={series} onSave={ev=>{setEvents([ev,...events]);setCurrentEv(ev);setView('event');}} onBack={()=>setView('dashboard')}/>;
      if(view==='createSeries')return <SeriesFormPage userId={user.id} onSave={s=>{setSeries([s,...series]);setCurrentSeries(s);setView('seriesDetail');}} onBack={()=>setView('dashboard')}/>;
      if(view==='editSeries')return <SeriesFormPage userId={user.id} existing={currentSeries} onSave={s=>{setSeries(series.map(x=>x.id===s.id?s:x));setCurrentSeries(s);setView('seriesDetail');}} onBack={()=>setView('seriesDetail')}/>;
      if(view==='seriesDetail')return <SeriesDetailPage series={currentSeries} events={events} onBack={()=>setView('dashboard')} onEdit={()=>setView('editSeries')} onNewInstance={ev=>{setEvents([ev,...events]);setCurrentEv(ev);setView('event');}} onSelectEvent={ev=>{setCurrentEv(ev);setView('event');}}/>;
      if(view==='event')return <EventDetailPage event={currentEvent} onBack={()=>setView('dashboard')} onEventUpdate={ev=>{setCurrentEv(ev);setEvents(prev=>prev.map(e=>e.id===ev.id?ev:e));}} onDuplicate={ev=>{setEvents([ev,...events]);setCurrentEv(ev);}}/>;
      if(view==='roster')return <RosterPage userId={user.id} onBack={()=>setView('dashboard')} onSelectMember={m=>{setCurrentMember(m);loadPackages(user.id);setView('memberDetail');}}/>;
      if(view==='memberDetail')return <MemberDetailPage member={currentMember} userId={user.id} packages={packages} onBack={()=>setView('roster')} onUpdate={()=>{loadPackages(user.id);}}/>;
      if(view==='packages')return <PackagesPage userId={user.id} onBack={()=>setView('dashboard')}/>;
      return <Dashboard profile={profile} userId={user.id} events={events} series={series} initialTab={lastTab} onCreateEvent={()=>setView('create')} onCreateSeries={()=>setView('createSeries')} onSelectEvent={ev=>{setLastTab('events');setCurrentEv(ev);setView('event');}} onSelectSeries={s=>{setLastTab('series');setCurrentSeries(s);setView('seriesDetail');}} onGoRoster={()=>{setLastTab('roster');setView('roster');}} onGoPackages={()=>{setLastTab('packages');setView('packages');}} onSignOut={()=>sb.auth.signOut()}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
