ze:14px}.link:hover{text-decoration:underline}.qr-container{text-align:center;padding:16px;background:#fff;border-radius:12px}.empty-state{text-align:center;padding:40px 16px;color:#8a8578}.live-count{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;background:#e8f5e9;color:#2d8a4e}.live-dot{width:7px;height:7px;border-radius:50%;background:#2d8a4e;animation:pulse 2s infinite}.event-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}.step-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:10px;margin-bottom:6px;border:1px solid #e0dbd0;transition:all .2s}.step-item.completed{background:#e8f5e9;border-color:#c8e6c9}.step-item.available{background:#fff;border-color:#e0dbd0;cursor:pointer}.step-item.available:hover{border-color:#e8632b}.step-item.locked{background:#f5f3ef;border-color:#e0dbd0;opacity:.6}.step-circle{width:28px;height:28px;min-width:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}.step-circle.done{background:#2d8a4e;color:#fff}.step-circle.open{background:#fff;border:2px solid #e8632b;color:#e8632b}.step-circle.num{background:#e0dbd0;color:#8a8578}.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}.status-live{background:#e8f5e9;color:#2d8a4e}.status-soon{background:#fff8e0;color:#9a7b00}.status-ended{background:#f0f0f0;color:#8a8578}.status-evergreen{background:#e8f0ff;color:#3a6fba}.countdown{font-size:12px;color:#8a8578;font-weight:500}.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.toggle{width:44px;height:24px;border-radius:12px;background:#e0dbd0;position:relative;cursor:pointer;transition:background .2s}.toggle.on{background:#e8632b}.toggle-knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;t function evStatus(ev){const n=new Date(),s=ev.starts_at?new Date(ev.starts_at):null,e=ev.ends_at?new Date(ev.ends_at):null;if(e&&n>e)return"ended";if(s&&n>=s&&(!e||n<=e))return"live";if(s&&n<s)return"upcoming";return"evergreen";}
function timeUntil(d){const df=new Date(d)-new Date();if(df<=0)return"now";const dy=Math.floor(df/864e5),hr=Math.floor(df%864e5/36e5),mn=Math.floor(df%36e5/6e4);return dy>0?`${dy}d ${hr}h`:hr>0?`${hr}h ${mn}m`:`${mn}m`;}
function timeLeft(d){const df=new Date(d)-new Date();if(df<=0)return"ended";const dy=Math.floor(df/864e5),hr=Math.floor(df%864e5/36e5);return dy>0?`${dy} day${dy!==1?'s':''} left`:`${hr} hour${hr!==1?'s':''} left`;}

function LCount({count}){return(<div className="live-count"><div className="live-dot"/>{count} checked in</div>)}
function SPill({status,ev}){if(status==="live")return <span className="status-pill status-live">● Live</span>;if(status==="upcoming")return <span className="status-pill status-soon">⏳ {timeUntil(ev.starts_at)}</span>;if(status==="ended")return <span className="status-pill status-ended">Ended</span>;return <span className="status-pill status-evergreen">Ongoing</span>;}
function Toggle({on,onToggle,label}){return(<div className="toggle-row"><span style={{fontSize:14,fontWeight:500}}>{label}</span><div className={`toggle ${on?"on":""}`} onClick={onToggle}><div className="toggle-knob"/></div></div>)}
function HomePage(){

  return(<div className="fade-in" style={{paddingTop:40,textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>🏘️</div><h1 className="serif" style={{fontSize:32,marginBottom:8}}>Community Merit</h1><p className="subtitle" style={{maxWidth:300,margin:"0 auto 32px"}}>Earn recognition for what you do for your community.</p>

    <p style={{fontSize:11,color:"#8a8578",marginTop:8}}>Includes a multi-step scavenger hunt demo.</p></div></div>);}

function StewardLogin(){
  const[email,sE]=useState(""),[name,sN]=useState(""),[org,sO]=useState(""),[mode,sM]=useState("login"),[ld,sLd]=useState(false),[err,sErr]=useState("");
  const login=async()=>{sLd(true);sErr("");const{data:d}=await sb.from("stewards").select("*").eq("email",email).single();if(!d){sErr("No steward found. Register below.");sM("register");}else{localStorage.setItem("steward",JSON.stringify(d));nav("/steward/dashboard");}sLd(false);};

    :st==="ended"?<><h3 className="serif" style={{marginBottom:4}}>Event Ended</h3><p style={{fontSize:13,color:"#8a8578"}}>No longer accepting check-ins.</p></>
    :<><h3 className="serif" style={{marginBottom:12}}>{ev.is_multi_step?"Get Started":"Check In"}</h3>
      <div className="field"><div className="label">Your Name</div><input value={name} onChange={e=>sN(e.target.value)} placeholder="Your name"/></div><div className="field"><div className="label">Email</div><input type="email" value={email} onChange={e=>sE(e.target.value)} placeholder="you@email.com"/></div>
      {err&&<p style={{color:"#e8632b",fontSize:13,marginBottom:12}}>{err}</p>}
      <button className="btn btn-primary btn-block" onClick={ident} disabled={!name||!email||ld}>{ld?"...":(ev.is_multi_step?"Start Hunt →":"Check In →")}</button>
      <p style={{fontSize:11,color:"#8a8578",textAlign:"center",marginTop:8}}>Email for your merit profile only.</p></>}</div></div>);}

function ProfileLogin(){
  const[email,sE]=useState(""),[ld,sLd]=useState(false),[err,sErr]=useState("");
  const go=async()=>{sLd(true);sErr("");const{data:d}=await sb.from("users").select("*").eq("email",email).single();if(!d)sErr("No profile found. Check in first!");else{localStorage.setItem("user",JSON.stringify(d));nav("/profile");}sLd(false);};
  return(<div className="fade-in"><TopBar title="My Profile" back="/"/><div className="card"><h2 className="serif">View Your Progress</h2><p className="subtitle">Enter the email you used to check in.</p>
    <div className="field"><div className="label">Email</div><input type="email" value={email} onChange={e=>sE(e.target.value)} placeholder="you@email.com"/></div>
    {err&&<p style={{color:"#e8632b",fontSize:13,marginBottom:12}}>{err}</p>}
    <button className="btn btn-primary btn-block" onClick={go} disabled={!email||ld}>{ld?"...":"View Profile"}</button>
    <p style={{fontSize:11,color:"#8a8578",textAlign:"center",marginTop:10}}>In the full app, we'll send a magic link. For this prototype, email lookup is instant.</p>
  </div></div>);}

function UserProfile(){
  const[user,sU]=useState(null),[badges,sBs]=useState([]),[cis,sCis]=useState([]),[mp,sMP]=useState([]),[editing,sEd]=useState(false),[dn,sDN]=useState(""),[bio,sBio]=useState("");
  useEffect(()=>{const u=JSON.parse(localStorage.getItem("user")||"null");if(!u){nav("/profile/login");return;}sU(u);sDN(u.display_name||"");sBio(u.bio||"");ld(u.id);},[]);
  const ld=async(uid)=>{const[bR,cR,mR]=await Promise.all([sb.from("user_badge_progress").select("*").eq("user_id",uid),sb.from("checkins").select("*").eq("user_id",uid).order("checked_in_at",{ascending:false}),sb.from("user_step_progress").select("*").eq("user_id",uid)]);
    sBs(bR.data||[]);sMP(mR.data||[]);const cl=cR.data||[];const en=[];for(const c of cl){const{data:ev}=await sb.from("events").select("*").eq("id",c.event_id).single();en.push({...c,event:ev});}sCis(en);};
  const save=async()=>{if(!user)return;await sb.from("users").update({display_name:dn||null,bio:bio||null}).eq("id",user.id);const u={...user,display_name:dn,bio};localStorage.setItem("user",JSON.stringify(u));sU(u);sEd(false);};
  if(!user)return null;const totM=badges.reduce((s,b)=>s+b.total_merit,0);
  return(<div className="fade-in"><TopBar title="My Profile" back="/" right={<span className="link" onClick={()=>{localStorage.removeItem("user");nav("/");}}>Sign Out</span>}/>
    <div className="card" style={{textAlign:"center"}}><div style={{fontSize:40,marginBottom:4}}>🏅</div><h2 className="serif">{user.display_name||user.name}</h2><p style={{fontSize:13,color:"#8a8578"}}>{user.email}</p>
      {user.bio&&<p style={{fontSize:14,marginTop:8}}>{user.bio}</p>}<div style={{marginTop:12}}><span style={{fontSize:24,fontWeight:700,color:"#e8632b"}}>{totM}</span><span style={{fontSize:13,color:"#8a8578",marginLeft:4}}>total merit</span></div>
      {!editing?<button className="btn btn-ghost btn-sm" style={{marginTop:12}} onClick={()=>sEd(true)}>Edit Profile</button>
      :<div style={{marginTop:12,textAlign:"left"}}><div className="field"><div className="label">Display Name</div><input value={dn} onChange={e=>sDN(e.target.value)} placeholder={user.name}/></div><div className="field"><div className="label">Bio</div><textarea value={bio} onChange={e=>sBio(e.target.value)} placeholder="A bit about you..."/></div><div style={{display:"flex",gap:8}}><button className="btn btn-primary btn-sm" onClick={save}>Save</button><button className="btn btn-ghost btn-sm" onClick={()=>sEd(false)}>Cancel</button></div></div>}
    </div>
    {badges.length>0&&<div className="card"><h3 className="serif" style={{marginBottom:12}}>My Badges</h3>
      {badges.map(b=>{const tn=[b.tier1_name,b.tier2_name,b.tier3_name],tm=[b.tier1_min,b.tier2_min,b.tier3_min],nt=b.current_tier<3?b.current_tier:2,pm=b.current_tier>=3?tm[2]:tm[nt];
        return(<div key={b.badge_id} className="card-flat"><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:22}}>{b.badge_emoji}</span><span style={{fontWeight:600}}>{b.badge_name}</span>{b.current_tier>0&&<TBadge tier={b.current_tier} name={tn[b.current_tier-1]}/>}</div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#8a8578"}}><span>{b.total_merit} merit · {b.total_checkins} check-in{b.total_checkins!==1?"s":""}</span>{b.current_tier<3&&<span>{tm[nt]-b.total_merit} to {tn[nt]}</span>}</div>
          <PBar cur={b.total_merit} max={pm} color={b.current_tier>=3?"#ffd700":b.current_tier>=2?"#a8a8a8":"#cd7f32"}/></div>);})}</div>}
    {mp.length>0&&<div className="card"><h3 className="serif" style={{marginBottom:12}}>Multi-Step Progress</h3>
      {mp.map(m=>(<div key={m.event_id} className="card-flat" style={{cursor:"pointer"}} onClick={()=>nav(`/event/${m.event_id}`)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontWeight:600,fontSize:14}}>{m.event_title}</span>{m.steps_completed>=m.total_steps&&<span style={{fontSize:12,color:"#2d8a4e",fontWeight:600}}>✓ Complete</span>}</div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#8a8578",marginBottom:4}}><span>{m.steps_completed} of {m.total_steps} steps</span><span>{m.merit_earned} merit</span></div>
        <PBar cur={m.steps_completed} max={m.total_steps} color={m.steps_completed>=m.total_steps?"#2d8a4e":"#e8632b"}/></div>))}</div>}
    <div className="card"><h3 className="serif" style={{marginBottom:12}}>Check-in History</h3>
      {cis.length===0?<p style={{fontSize:13,color:"#8a8578"}}>No check-ins yet.</p>:cis.map(c=>(<div key={c.id} className="checkin-row"><div><span style={{fontWeight:600}}>{c.event?.title||"Event"}</span><p style={{fontSize:12,color:"#8a8578"}}>{new Date(c.checked_in_at).toLocaleDateString()}{c.event?.location&&` · ${c.event.location}`}</p></div><span className="badge-pill" style={{fontSize:12}}>+{c.merit_earned}</span></div>))}</div>
  </div>);}

function App(){const[r,sR]=useState(getRoute());useEffect(()=>{const h=()=>sR(getRoute());window.addEventListener("hashchange",h);return()=>window.removeEventListener("hashchange",h);},[]);const{parts:p}=r;let pg;
  if(!p.length||(p.length===1&&p[0]===""))pg=<HomePage/>;
  else if(p[0]==="steward"&&p[1]==="login")pg=<StewardLogin/>;
  else if(p[0]==="steward"&&p[1]==="dashboard")pg=<StewardDashboard/>;
  else if(p[0]==="steward"&&p[1]==="event"&&p[2]==="new")pg=<CreateEvent/>;
  else if(p[0]==="steward"&&p[1]==="event"&&p[2])pg=<StewardEventDetail eventId={p[2]}/>;
  else if(p[0]==="steward"&&p[1]==="badge"&&p[2]==="new")pg=<CreateBadge/>;
  else if(p[0]==="event"&&p[1]&&p[2]==="step"&&p[3])pg=<EventCheckin eventId={p[1]} stepId={p[3]}/>;
  else if(p[0]==="event"&&p[1])pg=<EventCheckin eventId={p[1]}/>;
  else if(p[0]==="profile"&&p[1]==="login")pg=<ProfileLogin/>;
  else if(p[0]==="profile")pg=<UserProfile/>;
  else pg=<HomePage/>;
  return <div className="app">{pg}</div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
